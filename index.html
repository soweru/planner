<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Планер</title>
<style>
:root{
  --ink:#0f1424;--ink2:#4a566e;--mut:#8a94a8;
  --paper:#EEF0F5;--card:#fff;--line:#d7dbe5;
  --blue:#2B44E0;--amber:#E8820C;--green:#159A66;--red:#D8391F;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0}
button{font:inherit;color:inherit;cursor:pointer}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px;
  width:min(440px,100%)}
.auth-box h1{margin:0 0 6px;font-size:26px}
.auth-box .sub{color:var(--ink2);font-size:15px;margin:0 0 28px}
.auth-tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:24px}
.auth-tabs button{flex:1;padding:10px;border:none;background:#f5f7fb;font-weight:600;font-size:15px;cursor:pointer}
.auth-tabs button.on{background:var(--ink);color:#fff}
.f{margin-bottom:16px}
.f label{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:7px}
.f input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fbfcfe;-webkit-appearance:none}
.f input:focus{outline:2px solid var(--blue);border-color:transparent}
.pass-row{position:relative}
.pass-row input{padding-right:110px}
.pass-gen{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:1px solid var(--line);background:#f4f6fa;border-radius:7px;padding:5px 10px;
  font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.pass-gen:hover{background:#e8eaf2}
.strength{margin-top:8px;display:none}
.strength.on{display:block}
.strength-bar{height:5px;border-radius:3px;background:#e3e7ef;overflow:hidden;margin-bottom:6px}
.strength-bar i{display:block;height:100%;border-radius:3px;transition:width .3s,background .3s}
.strength-rules{display:flex;flex-direction:column;gap:3px}
.rule{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.rule.ok{color:var(--green)}
.rule::before{content:"○";font-size:10px}
.rule.ok::before{content:"●";color:var(--green)}
.btn-full{width:100%;padding:14px;border-radius:12px;border:none;background:var(--ink);color:#fff;
  font-size:16px;font-weight:700;margin-top:8px;cursor:pointer;-webkit-appearance:none}
.btn-full:disabled{opacity:.5;cursor:not-allowed}
.auth-err{font-size:14px;margin-top:10px;padding:10px 14px;border-radius:8px;display:none}
.auth-err.on{display:block}
.auth-err.err{background:#fef4f2;color:var(--red);border:1px solid #fca5a5}
.auth-err.ok{background:#f2fbf7;color:var(--green);border:1px solid #86efac}

/* APP */
.app{display:none;padding:18px 40px 80px}
.app.on{display:block}
.wrap{max-width:1180px;margin:0 auto}
h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:0 0 12px;font-weight:700}

.head{position:sticky;top:0;z-index:20;background:var(--paper);padding:10px 0 14px;
  border-bottom:1px solid var(--line);margin-bottom:18px}
.pager{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pager .nav{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.pager .dt{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.pager .tb{width:auto;padding:0 12px;font-size:13px;height:34px;color:var(--ink2);
  border:1px solid var(--line);background:var(--card);border-radius:10px}
.pager .tb.user{color:var(--mut);font-size:12px}
.bigrow{display:flex;align-items:baseline;gap:14px;margin:8px 0 10px;flex-wrap:wrap}
.big{font-family:var(--mono);font-size:64px;font-weight:600;letter-spacing:-.04em;line-height:.9}
.bigsub{font-size:14px;color:var(--ink2);max-width:480px}
.segs{display:flex;gap:3px;height:14px}
.seg{background:#dee2ec;border-radius:2px;overflow:hidden;min-width:3px}
.seg i{display:block;height:100%;background:var(--blue);transition:width .3s}
.seg.done i{background:var(--green)}
.seg.free{background:repeating-linear-gradient(135deg,#e4e7ef 0 5px,#dbdfe9 5px 10px)}

/* WEEK */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:14px}
.wd{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px;cursor:pointer}
.wd.sel{border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.wd.ok{border-color:var(--green);background:#f2fbf7}
.wd.late{border-color:#fca5a5;background:#fef4f2}
.wd .dn{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);
  margin-bottom:6px;display:flex;justify-content:space-between}
.q{display:flex;align-items:center;gap:4px;margin:4px 0;font-size:12.5px}
.q .qn{flex:1;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .qv{font-family:var(--mono);font-size:12px}
.q .qv.ok{color:var(--green);font-weight:700}
.q button{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);background:#f2f4f9;font-size:12px;line-height:1;padding:0}
.q .adj{font-family:var(--mono);font-size:10px;color:var(--mut)}
.wd .carry{margin-top:7px;font-size:11px;color:var(--ink2);font-weight:600;background:#f1f3f8;
  border:1px solid var(--line);border-radius:7px;padding:4px 7px;width:100%;text-align:center}
.wd .skip{margin-top:4px;font-size:11px;color:var(--mut);border:1px dashed var(--line);
  background:none;border-radius:7px;padding:4px 7px;width:100%;text-align:center}

/* WEEKLY STATS */
.wstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:20px}
.wstat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.wstat .wsn{font-size:12px;color:var(--ink2);margin-bottom:5px}
.wstat .wsv{font-family:var(--mono);font-size:18px;font-weight:600;margin-bottom:4px}
.wstat .wsbar{height:6px;background:#e3e7ef;border-radius:3px;overflow:hidden}
.wstat .wsbar i{display:block;height:100%;border-radius:3px;transition:width .4s}

/* LAYOUT */
.cols{display:grid;grid-template-columns:1.85fr 1fr;gap:22px;align-items:start}
@media(max-width:980px){.cols{grid-template-columns:1fr}.week{grid-template-columns:repeat(4,1fr)}.app{padding:12px 12px 80px}.big{font-size:50px}}

/* TASKS */
.task{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
.task.done{border-color:#b7e2d0;background:#f5fbf8}
.task.drag-over{border-color:var(--blue);border-style:dashed}
.thead{display:flex;align-items:flex-start;gap:10px}
.grip{cursor:grab;color:var(--mut);font-size:14px;flex:none;padding-top:2px}
.w{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--blue);min-width:46px;text-align:right;flex:none}
.task.done .w{color:var(--green)}
.tname{flex:1;font-weight:700;font-size:16px}
.tall-cb{width:19px;height:19px;accent-color:var(--blue);flex:none;margin-top:2px;cursor:pointer}
.badge{font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:5px;font-weight:800;white-space:nowrap;flex:none}
.b-red{background:#ffe4e0;color:var(--red)}.b-amber{background:#fdf0dc;color:var(--amber)}
.b-grey{background:#eceff5;color:var(--ink2)}.b-blue{background:#e5e8fd;color:var(--blue)}
.tools{display:flex;gap:3px;flex:none}
.tools button{border:1px solid var(--line);background:#f4f6fa;border-radius:7px;width:27px;height:27px;font-size:12px;padding:0}
.meta{margin:7px 0 0 56px;font-size:12px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap}
.subs{margin:9px 0 0 56px;display:flex;flex-direction:column;gap:1px}
.subs.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:1px 12px}
label.sub{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 0;font-size:15px}
label.sub input{width:17px;height:17px;accent-color:var(--blue);flex:none}
label.sub .pct{font-family:var(--mono);font-size:12px;color:var(--mut);margin-left:auto}
label.sub.on .txt{color:var(--mut);text-decoration:line-through}
.addbtn{width:100%;border:2px dashed var(--line);background:none;border-radius:13px;padding:14px;
  font-size:15px;font-weight:600;color:var(--ink2)}
.addbtn:hover{border-color:var(--blue);color:var(--blue)}
.budget{font-size:13px;color:var(--ink2);margin-bottom:11px;font-family:var(--mono)}
.budget b{color:var(--blue)}

/* SIDE */
.side{position:sticky;top:170px;display:flex;flex-direction:column;gap:14px}
@media(max-width:980px){.side{position:static}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px}
.bonus{list-style:none;margin:10px 0 0;padding:0;max-height:320px;overflow:auto}
.bonus li{border-bottom:1px solid #eef0f5}
.bonus label{display:flex;gap:9px;align-items:flex-start;padding:8px 2px;font-size:14px;cursor:pointer}
.bonus input{width:17px;height:17px;accent-color:var(--green);flex:none;margin-top:2px}
.bonus .bt{flex:1}
.bonus .due{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.bonus .due.soon{color:var(--amber)}.bonus .due.over{color:var(--red)}
.bonus label.on .bt{color:var(--mut);text-decoration:line-through}
.bonus .ed{border:none;background:none;color:var(--mut);font-size:11px;padding:2px 4px;align-self:center}
.star{color:var(--amber)}
.smalladd{margin-top:9px;border:1px dashed var(--line);background:none;border-radius:9px;padding:8px;width:100%;font-size:13px;color:var(--ink2)}
.donutrow{display:flex;gap:14px;align-items:center;margin-bottom:4px}

/* SOCIAL TRACKER */
.socials{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.soc{background:#f8f9fc;border:1px solid var(--line);border-radius:10px;padding:10px}
.soc .sname{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.soc .sval{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--ink)}
.soc .sdelta{font-size:12px;margin-top:2px}
.soc .sdelta.up{color:var(--green)}.soc .sdelta.dn{color:var(--red)}.soc .sdelta.same{color:var(--mut)}
.soc .sedit{width:100%;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:inherit;font-size:14px;font-family:var(--mono);margin-top:7px;background:var(--card)}
.soc-add{grid-column:1/-1;border:1px dashed var(--line);background:none;border-radius:10px;padding:9px;font-size:13px;color:var(--ink2)}

/* MODAL */
.mask{position:fixed;inset:0;background:rgba(15,20,36,.52);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:16px;padding:22px;width:min(660px,100%);max-height:92vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:20px}
.lead{font-size:14px;color:var(--ink2);margin:0 0 16px;line-height:1.5}
.mf{margin-bottom:15px}
.mf>label{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin-bottom:7px}
.mf input[type=text],.mf input[type=number],.mf input[type=date],.mf textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fbfcfe}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#f5f7fb;border-radius:999px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:580px){.two{grid-template-columns:1fr}}
.subrow{display:flex;gap:7px;margin-bottom:7px;align-items:center}
.subrow input[type=text]{flex:1}.subrow input[type=number]{width:75px}
.subrow .sp{font-family:var(--mono);font-size:12px;color:var(--mut);min-width:42px;text-align:right}
.subrow button{border:1px solid var(--line);background:#f4f6fa;border-radius:7px;min-width:30px;height:36px;padding:0 8px}
.hint{font-size:12.5px;color:var(--mut);margin-top:7px;line-height:1.45}
.acts{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.acts button{padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:#f4f6fa;font-weight:600}
.acts .go{background:var(--ink);color:#fff;border-color:var(--ink)}
.acts .del{color:var(--red);margin-right:auto}
.opt{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left;background:#fbfcfe}
.opt:hover{border-color:var(--ink)}
.opt b{display:block;font-size:15px;margin-bottom:2px}
.opt span{font-size:12px;color:var(--mut)}
.range{display:flex;align-items:center;gap:10px}
.range input[type=range]{flex:1;accent-color:var(--blue)}
.range .val{font-family:var(--mono);font-size:20px;min-width:54px;text-align:right}
.goalrow{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.goalrow input[type=text]{flex:1}
.goalrow .dr{border:1px solid var(--line);background:#f5f7fb;border-radius:8px;padding:8px 10px;font-size:14px}
.goalrow .dr.on{background:#fff3dd;border-color:#e8c98a;color:#8a6314}
.dream{background:#fff8ec;border:1px solid #f3ddb8;border-radius:10px;padding:9px 12px;margin:0 0 16px;
  font-size:14px;color:#7a5717;display:flex;gap:9px;align-items:center}
.dream b{color:#5d420f}
.dream button{margin-left:auto;border:none;background:none;color:#b08a45;font-size:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(160%);
  background:var(--ink);color:#fff;padding:14px 20px;border-radius:12px;max-width:min(560px,92vw);
  z-index:80;transition:transform .33s;font-size:15px;line-height:1.45}
.toast.on{transform:translateX(-50%) translateY(0)}
.archive{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.archive button{border:none;background:none;color:var(--blue);font-size:12px;text-decoration:underline}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!-- AUTH SCREEN -->
<div class="auth-wrap" id="authWrap">
  <div class="auth-box">
    <h1>Планер</h1>
    <p class="sub">Войди или создай аккаунт</p>
    <div class="auth-tabs">
      <button class="on" id="tabLogin">Войти</button>
      <button id="tabReg">Регистрация</button>

    <div id="regFields" style="display:none">

      </div>

            style="padding:12px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fbfcfe;text-align:center">

      </div>
    </div>
    <div class="f"><label>Email</label><input type="email" id="aEmail" placeholder="your@email.com"></div>

          <div class="rule" id="r-num">Цифра (0–9)</div>
          <div class="rule" id="r-sym">Символ (!@#$%^&*)</div>
        </div>
      </div>
    </div>
    <div class="f" id="aPass2wrap" style="display:none">
      <label>Пароль ещё раз</label>
      <input type="password" id="aPass2" placeholder="повтори пароль">
    </div>
    <button class="btn-full" id="aBtn">Войти</button>
    <div class="auth-err" id="aErr"></div>
  </div>
</div>

<!-- APP SCREEN -->
<div class="app" id="appWrap">
<div class="wrap">
  <div class="head">
    <div class="pager">
      <button class="nav" id="prev">‹</button>
      <div class="dt" id="dt"></div>
      <button class="nav" id="next">›</button>
      <button class="tb" id="tobtn">сегодня</button>
      <button class="tb" id="repeatsbtn">повторы</button>
      <button class="tb" id="goalsbtn">цели</button>
      <button class="tb" id="databtn">данные</button>
      <button class="tb user" id="userbtn"></button>
    </div>
    <div class="bigrow"><div class="big" id="big">0%</div><div class="bigsub" id="bigsub"></div></div>
    <div class="segs" id="segs"></div>
  </div>
  <div id="dreambox"></div>
  <div class="week" id="weekstrip"></div>
  <div class="wstats" id="wstats"></div>

    <div>
      <h2>Задачи дня</h2>
      <div class="budget" id="budget"></div>
      <div id="tasks"></div>

    </div>
    <div class="side">
      <div class="panel">
        <h2>Можно не сегодня</h2>
        <div class="donutrow">
          <svg width="88" height="88" viewBox="0 0 112 112" id="donut"></svg>
          <div style="font-size:13px;color:var(--ink2)" id="bonustxt"></div>
        </div>

        <button class="smalladd" id="addbonus">+ Добавить необязательное</button>
      </div>
      <div class="panel">
        <h2>Соцсети</h2>
        <div class="socials" id="socials"></div>
      </div>
    </div>
  </div>
</div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
var SB_URL='https://dtiwlacligiqyjeeajqo.supabase.co';

const KEY="planner_v3";

const SHORT=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const IMP=[["hi","Очень важно"],["mid","Важно"],["low","Не важно"]];

function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dateOf(k){const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)}
function shift(k,n){const d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d)}
const todayKey=()=>keyOf(new Date());
function human(k){const d=dateOf(k);return DAYNAMES[d.getDay()]+" · "+d.getDate()+" "+MONTHS[d.getMonth()]}
function shortHuman(k){const d=dateOf(k);return d.getDate()+" "+MONTHS[d.getMonth()]}
const daysBetween=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
const sub=(n,u)=>({id:uid(),n:n||"",u:+u||1,done:false});

/* ---------- Supabase DB via fetch ---------- */
function sbHeader(){
  var tok=localStorage.getItem('sb_token')||SB_KEY;
  return{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+tok};
}
async function loadFromDB(){
  if(!user)return null;
  try{
    var r=await fetch(SB_URL+'/rest/v1/planner_data?select=data&user_id=eq.'+encodeURIComponent(user.id)+'&order=updated_at.desc&limit=1',
      {headers:Object.assign({},sbHeader(),{'Prefer':'return=representation'})});
    if(!r.ok){console.warn('loadFromDB status',r.status);return null;}
    var rows=await r.json();
    if(Array.isArray(rows)&&rows.length&&rows[0].data)return rows[0].data;
  }catch(e){console.error('loadFromDB',e)}
  return null;
}
async function saveToDB(){
  if(!user||!S)return;
  var body=JSON.stringify({user_id:user.id,data:S});
  try{
    // First try update existing row
    var ru=await fetch(SB_URL+'/rest/v1/planner_data?user_id=eq.'+encodeURIComponent(user.id),{
      method:'PATCH',
      headers:Object.assign({},sbHeader(),{'Prefer':'return=minimal'}),
      body:body
    });
    if(ru.ok){
      // If no rows updated, insert new one
      var affected=ru.headers.get('content-range');
      if(affected==='*/*'||!affected){
        await fetch(SB_URL+'/rest/v1/planner_data',{
          method:'POST',
          headers:Object.assign({},sbHeader(),{'Prefer':'return=minimal'}),
          body:body
        });
      }
      try{localStorage.setItem(KEY+'_'+user.id,body)}catch(e){}
      return;
    }
    console.error('saveToDB patch failed',ru.status);
    toast('⚠️ Не удалось сохранить. Сделай резервную копию через «данные».');
  }catch(e){
    console.error('saveToDB network',e);
    try{localStorage.setItem(KEY+'_'+user.id,body)}catch(e2){}
    toast('⚠️ Нет сети — данные сохранены локально.');
  }
}
var saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  // save fast — 300ms, not 600
  saveTimer=setTimeout(saveToDB,300);
}

const defaultRules=()=>[

  {id:uid(),qid:"ch",n:"Челлендж",amount:1,mode:"daily",days:[1,2,3,4,5,6,0],on:2,off:2,every:2,start:todayKey()}
];
function seed(){
  return{days:{},bonus:[
    {id:uid(),n:"Скачать видео для монтажа",star:false,due:null,doneOn:null},
    {id:uid(),n:"Посмотреть уроки по монтажу",star:false,due:null,doneOn:null},
    {id:uid(),n:"Съездить на море",star:true,due:null,doneOn:null}
  ],archive:[],socials:[
    {id:uid(),name:"YouTube",handle:"soweru",color:"#FF0000",entries:[]},
    {id:uid(),name:"TikTok",handle:"soweru",color:"#000",entries:[]},
    {id:uid(),name:"Telegram",handle:"soweru",color:"#229ED9",entries:[]},
    {id:uid(),name:"Instagram",handle:"soweru",color:"#E1306C",entries:[]}
  ],profile:{onboarded:false,goals:[],joys:[],about:"",lastAsk:null,dreamShown:null,dreamHidden:null},
  carries:[],rules:defaultRules(),weekStart:null};
}
function migrate(o){
  if(!o||typeof o!=="object")return seed();
  const s=seed();
  s.days=o.days||{};
  s.carries=o.carries||[];
  s.rules=o.rules||defaultRules();
  s.archive=o.archive||[];
  s.socials=o.socials||s.socials;
  s.weekStart=o.weekStart||null;
  if(o.bonus&&Array.isArray(o.bonus)){
    s.bonus=o.bonus.map(b=>({id:b.id||uid(),n:(b.n||"").replace(/^★\s*/,""),star:b.star||/^★/.test(b.n||""),due:b.due||null,doneOn:b.doneOn||null}));
  }
  const p=o.profile||{};
  s.profile.onboarded=!!p.onboarded;
  s.profile.joys=Array.isArray(p.joys)?p.joys:[];
  s.profile.about=p.about||"";
  s.profile.lastAsk=p.lastAsk||null;
  s.profile.dreamShown=p.dreamShown||null;
  s.profile.dreamHidden=p.dreamHidden||null;
  if(Array.isArray(p.goals))s.profile.goals=p.goals.map(g=>typeof g==="string"?{id:uid(),t:g,dream:false}:g);
  else if(typeof p.goals==="string"&&p.goals.trim())
    s.profile.goals=p.goals.split(/[,\n;]+/).map(t=>t.trim()).filter(Boolean).map(t=>({id:uid(),t,dream:false}));
  if(s.profile.goals.length&&!s.profile.goals.some(g=>g.dream))s.profile.goals[0].dream=true;
  Object.keys(s.days).forEach(k=>{
    const d=s.days[k];
    if(Array.isArray(d.bonus)){delete d.bonus}
    (d.quota||[]).forEach(q=>{q.moved=q.moved||0;q.extra=q.extra||0;q.skipped=q.skipped||0});
    (d.tasks||[]).forEach(t=>{if(!("sid" in t))t.sid=null});
  });
  return s;
}

/* ---------- repeat rules ---------- */
function ruleHits(r,k){
  if(r.mode==="daily")return true;
  if(r.mode==="weekdays")return(r.days||[]).includes(dateOf(k).getDay());
  const n=daysBetween(r.start||k,k);
  if(r.mode==="cycle"){const len=Math.max(1,(+r.on||1)+(+r.off||0));return(((n%len)+len)%len)<(+r.on||1)}
  if(r.mode==="everyN"){const e=Math.max(1,+r.every||1);return(((n%e)+e)%e)===0}
  return false;
}
function goalFor(qid,k){return(S.rules||[]).filter(r=>r.qid===qid&&ruleHits(r,k)).reduce((a,r)=>a+Math.max(0,+r.amount||0),0)}
function applyRules(k,d){
  const ids=[...new Set((S.rules||[]).map(r=>r.qid))];
  ids.forEach(qid=>{
    const rule=(S.rules||[]).find(r=>r.qid===qid);if(!rule)return;
    let q=d.quota.find(x=>x.id===qid);
    if(!q){q={id:qid,n:rule.n,goal:0,done:0,moved:0,extra:0,skipped:0};d.quota.push(q)}
    q.n=rule.n;
    if(!q.manual)q.goal=goalFor(qid,k);
  });
}
const need=q=>Math.max(0,(+q.goal||0)-(q.moved||0)+(q.extra||0)-(q.skipped||0));
const quotaVisible=q=>need(q)>0||q.done>0;

function daily(){
  return[
    task("Разговорные ролики",15,"hi","hi",{t:"Обязательно сейчас",c:"b-red"},[sub("Смонтировать",2),sub("Выложить",1)],false,"s_rz"),
    task("Обычные ролики",12,"hi","hi",null,[sub("Нарезка",1),sub("Озвучка",1),sub("Выложить",0.5)],false,"s_ob"),
    task("Челлендж — ролик дня",18,"hi","hi",{t:"Обязательно сейчас",c:"b-red"},[sub("Озвучить",1),sub("Смонтировать",3),sub("Выложить",1)],false,"s_ch"),
    task("Финансы понемногу",10,"hi","mid",{t:"Каждый день",c:"b-blue"},[sub("Теория",1),sub("Задачи",1)],false,"s_fin"),
    task("Проверить кабинеты по таргету",8,"hi","hi",{t:"Каждый день",c:"b-blue"},[sub("Все кабинеты",1)],false,"s_tgt"),
  ];
}
const newQuota=()=>[];
function day(k){
  if(!S.days[k])S.days[k]={tasks:daily(),quota:newQuota()};
  const d=S.days[k];
  if(!d.tasks)d.tasks=[];
  if(!d.quota)d.quota=[];
  d.quota.forEach(q=>{q.moved=q.moved||0;q.extra=q.extra||0;q.skipped=q.skipped||0});
  applyRules(k,d);
  return d;
}
const planned=k=>day(k).tasks.reduce((a,t)=>a+(+t.w||0),0);
function prog(t){const tot=t.subs.reduce((a,s)=>a+(+s.u||0),0)||1;return t.subs.reduce((a,s)=>a+(s.done?+s.u:0),0)/tot*100}

/* ---------- weekly reset ---------- */
function maybeWeeklyReset(){
  const tk=todayKey(),d=dateOf(tk),dow=d.getDay();
  const mon=shift(tk,-((dow+6)%7));
  if(S.weekStart===mon)return;
  S.weekStart=mon;
  // clear skipped debts from previous weeks
  Object.keys(S.days).forEach(k=>{
    if(k<mon)(S.days[k].quota||[]).forEach(q=>q.skipped=q.extra=q.moved=0);
  });
}

/* ---------- AUTH ---------- */
async function initAuth(){
  var token=localStorage.getItem('sb_token');
  if(token){
    try{
      var r=await fetch(SB_URL+'/auth/v1/user',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token}});
      var u=await r.json();
      if(u&&u.id){await startApp(u);return}
    }catch(e){}
    localStorage.removeItem('sb_token');localStorage.removeItem('sb_refresh');
  }
  showAuth();
}
function showAuth(){document.getElementById("authWrap").style.display="flex";document.getElementById("appWrap").classList.remove("on")}
async function startApp(u){
  user=u;
  document.getElementById("authWrap").style.display="none";
  document.getElementById("appWrap").classList.add("on");
  document.getElementById("userbtn").textContent=(u.email||'').split("@")[0]+" →";
  var raw=await loadFromDB();
  if(!raw){
    // fallback: try user-specific local backup
    try{
      var v=localStorage.getItem(KEY+'_'+u.id);
      if(v)raw=JSON.parse(v);
    }catch(e){}
  }
  if(!raw){
    // last resort: anonymous local data (old version before auth)
    try{
      var v=localStorage.getItem(KEY);
      if(v)raw=JSON.parse(v);
    }catch(e){}
  }
  S=raw?migrate(raw):seed();
  sel=todayKey();
  maybeWeeklyReset();
  render();
  // save to DB immediately so data is there on next login
  await saveToDB();
  if(!S.profile.onboarded)goalsModal(true);
  else maybeWeeklyAsk();
}

function checkPass(p){
  return{len:p.length>=8,upper:/[A-Z]/.test(p),num:/[0-9]/.test(p),sym:/[!@#$%^&*()\-_+=\[\]{};':"\\|,.<>/?]/.test(p)};
}
function updateStrength(p){
  var c=checkPass(p),score=[c.len,c.upper,c.num,c.sym].filter(Boolean).length;
  var cols=['#9f1239','#ef4444','#f59e0b','#22c55e','#159A66'];
  var bar=g('strengthBar');bar.style.width=(score*25)+'%';bar.style.background=cols[score];
  ['len','upper','num','sym'].forEach(function(k){g('r-'+k).classList.toggle('ok',c[k])});
}
g('aPass').addEventListener('input',function(){if(authMode==='reg')updateStrength(this.value)});

function genPassword(){
  var U='ABCDEFGHJKLMNPQRSTUVWXYZ',L='abcdefghjkmnpqrstuvwxyz',N='23456789',S='!@#$%^&*';
  var all=U+L+N+S,pwd=[U[Math.random()*U.length|0],L[Math.random()*L.length|0],N[Math.random()*N.length|0],S[Math.random()*S.length|0]];
  for(var i=0;i<8;i++)pwd.push(all[Math.random()*all.length|0]);
  pwd.sort(function(){return Math.random()-.5});
  var result=pwd.join('');
  g('aPass').value=result;g('aPass').type='text';
  if(g('aPass2'))g('aPass2').value=result;
  updateStrength(result);
  setTimeout(function(){g('aPass').type='password'},2000);
  try{navigator.clipboard.writeText(result);showAuthMsg('Пароль сгенерирован и скопирован','ok')}catch(e){}
}

async function doAuth(){
  var email=g('aEmail').value.trim(),pass=g('aPass').value;
  showAuthMsg('','');
  if(!email||!pass){showAuthMsg('Заполни почту и пароль','err');return}
  if(authMode==='reg'){
    var c=checkPass(pass);
    if(!c.len||!c.upper||!c.num||!c.sym){showAuthMsg('Пароль не соответствует требованиям','err');return}
    var pass2=g('aPass2')&&g('aPass2').value;
    if(pass!==pass2){showAuthMsg('Пароли не совпадают','err');return}
  }
  var btn=g('aBtn');btn.disabled=true;btn.textContent='Подождите...';
  try{
    if(authMode==='reg'){
      var d=await sbPost('/auth/v1/signup',{email:email,password:pass,data:{
        name:(g('fName')||{value:''}).value,surname:(g('fSurname')||{value:''}).value,
        phone:(g('fPhone')||{value:''}).value,
        bday:(function(){
          var d=g('fBday').value.padStart(2,'0'),m=g('fBmon').value,y=g('fByear').value;
          return(d&&m&&y)?y+'-'+m+'-'+d:'';
        })()}});
      if(d.error||d.msg){showAuthMsg(d.error||d.msg||'Ошибка','err');btn.disabled=false;btn.textContent='Создать аккаунт';return}
      showAuthMsg('Письмо с подтверждением отправлено на '+email+'. Пожалуйста, подтверди адрес — после этого можно войти.','ok');
      btn.disabled=false;btn.textContent='Создать аккаунт';
    }else{
      var d=await sbPost('/auth/v1/token?grant_type=password',{email:email,password:pass});
      if(d.error||d.error_description){showAuthMsg('Неверная почта или пароль','err');btn.disabled=false;btn.textContent='Войти';return}
      if(d.access_token){
        localStorage.setItem('sb_token',d.access_token);
        localStorage.setItem('sb_refresh',d.refresh_token||'');
        user=d.user;showAuthMsg('Вхожу...','ok');
        setTimeout(function(){startApp(d.user)},500);
      }
    }
  }catch(e){showAuthMsg('Ошибка сети — попробуй ещё раз','err');btn.disabled=false;btn.textContent=authMode==='reg'?'Создать аккаунт':'Войти'}
}

/* ---------- render ---------- */
function render(){
  const d=day(sel),P=planned(sel);
  document.getElementById("dt").textContent=human(sel);
  let earned=0;d.tasks.forEach(t=>earned+=t.w*prog(t)/100);
  const pct=P?Math.round(earned/P*100):0;
  const b=document.getElementById("big");b.textContent=pct+"%";b.style.color=pct>=100?"var(--green)":"var(--ink)";
  document.getElementById("bigsub").textContent=P===0?"На этот день задач нет":pct>=100?"День закрыт":"Выполнено "+fmt(earned)+" из "+P+"% запланированного";
  document.getElementById("budget").innerHTML="Запланировано <b>"+P+"%</b>"+(P>100?" · овер-планинг, проценты покажут долю закрытого":P<100?" · свободно "+(100-P)+"%":"");
  const segs=document.getElementById("segs");segs.innerHTML="";
  d.tasks.forEach(t=>{const p=prog(t),e=document.createElement("div");e.className="seg"+(p>=100?" done":"");e.style.flexGrow=t.w;e.innerHTML='<i style="width:'+p+'%"></i>';segs.appendChild(e)});
  if(P<100){const f=document.createElement("div");f.className="seg free";f.style.flexGrow=100-P;segs.appendChild(f)}
  renderDream();renderWeek();renderWeekStats();renderTasks();renderBonus();renderSocials();
}

function renderDream(){
  const box=document.getElementById("dreambox");
  const dream=S.profile.goals.find(g=>g.dream);
  if(!dream||S.profile.dreamHidden===todayKey()){box.innerHTML="";return}
  box.innerHTML='<div class="dream"><span>✦</span><div>Ради чего всё: <b>'+esc(dream.t)+'</b></div><button>×</button></div>';
  box.querySelector("button").onclick=()=>{S.profile.dreamHidden=todayKey();scheduleSave();renderDream()};
}

function renderWeek(){
  const box=document.getElementById("weekstrip");box.innerHTML="";
  const dow=dateOf(sel).getDay(),start=shift(sel,-((dow+6)%7)),TK=todayKey();
  for(let i=0;i<7;i++){
    const k=shift(start,i),d=day(k),dt=dateOf(k);
    const vis=d.quota.filter(quotaVisible);
    const ok=vis.length>0&&vis.every(q=>q.done>=need(q));
    const late=!ok&&vis.length>0&&k<TK;
    const el=document.createElement("div");
    el.className="wd"+(k===sel?" sel":"")+(ok?" ok":late?" late":"");
    const dn=document.createElement("div");dn.className="dn";
    dn.innerHTML="<span>"+SHORT[dt.getDay()]+" "+dt.getDate()+"</span>"+(ok?"<span style='color:var(--green)'>✓</span>":"");
    el.appendChild(dn);
    vis.forEach(q=>{
      const adj=(q.extra||0)-(q.moved||0);
      const r=document.createElement("div");r.className="q";
      r.innerHTML='<button data-a="-">−</button><button data-a="+">+</button><span class="qn">'+esc(q.n)+'</span><span class="qv'+(q.done>=need(q)?" ok":"")+'">'+q.done+"/"+q.goal+"</span>"+(adj?'<span class="adj">'+(adj>0?"+":"")+adj+"</span>":"");
      r.querySelectorAll("button").forEach(bt=>bt.onclick=ev=>{ev.stopPropagation();q.done=Math.max(0,q.done+(bt.dataset.a==="+"?1:-1));scheduleSave();render()});
      el.appendChild(r);
    });
    if(vis.some(q=>q.done<need(q))){
      const c=document.createElement("button");c.className="carry";c.textContent="Перенести";
      c.onclick=ev=>{ev.stopPropagation();carryModal(k)};el.appendChild(c);
      const pen=document.createElement("button");pen.className="skip";pen.textContent="✎ Изменить план";
      pen.onclick=ev=>{ev.stopPropagation();quotaModal(k)};el.appendChild(pen);
    }
    el.onclick=()=>{sel=k;render()};
    box.appendChild(el);
  }
}

  const draw=()=>{
    openModal('<h3>План на '+human(k).toLowerCase()+'</h3>'+
      '<p class="lead">Измени план этого дня: переименуй показатель, поправь число или убери крестиком. Крестик убирает только в этот день — в остальных всё остаётся.</p>'+
      '<div id="ql">'+d.quota.map((q,i)=>'<div class="subrow">'+

    document.querySelectorAll("#ql [data-g]").forEach(el=>el.oninput=e=>{const q=d.quota[+el.dataset.g];q.goal=Math.max(0,+e.target.value||0);q.manual=true;scheduleSave();renderWeek()});

  };draw();
}

/* ---------- weekly stats ---------- */
function statColor(pct){
  if(pct>=90)return"#166534";
  if(pct>=70)return"#15803d";
  if(pct>=50)return"#22c55e";
  if(pct>=30)return"#f59e0b";
  if(pct>=15)return"#ef4444";
  return"#9f1239";
}
function renderWeekStats(){
  const box=document.getElementById("wstats");box.innerHTML="";
  const dow=dateOf(sel).getDay(),start=shift(sel,-((dow+6)%7));
  const ids=[...new Set((S.rules||[]).map(r=>r.qid))];
  ids.forEach(qid=>{
    const rule=(S.rules||[]).find(r=>r.qid===qid);if(!rule)return;
    let totalGoal=0,totalDone=0;
    for(let i=0;i<7;i++){
      const k=shift(start,i),d=day(k);
      const q=d.quota.find(x=>x.id===qid);
      if(!q)continue;
      totalGoal+=q.goal;
      totalDone+=q.done;
    }
    if(!totalGoal)return;
    const pct=Math.min(100,Math.round(totalDone/totalGoal*100));
    const col=statColor(pct);
    const el=document.createElement("div");el.className="wstat";
    el.innerHTML='<div class="wsn">'+esc(rule.n)+' за неделю</div>'+
      '<div class="wsv" style="color:'+col+'">'+totalDone+" / "+totalGoal+'</div>'+
      '<div class="wsbar"><i style="width:'+pct+'%;background:'+col+'"></i></div>';
    box.appendChild(el);
  });
}

function repeatsModal(){
  const draw=()=>{
    openModal('<h3>Повторяющиеся задачи</h3><p class="lead">Норма на каждый день — как в Google Calendar. Задача не повторяется в этот день → строка не показывается.</p>'+
      '<div id="rl">'+(S.rules.length?S.rules.map(r=>'<button class="opt" data-r="'+r.id+'"><b>'+esc(r.n)+'</b><span>'+ruleText(r)+'</span></button>').join(""):'<p style="color:var(--mut)">Ничего нет</p>')+'</div>'+
      '<button class="smalladd" id="radd" style="width:auto;padding:9px 16px">+ повторяющаяся задача</button>'+
      '<div class="acts"><button class="go" data-x>Готово</button></div>');
    document.querySelectorAll("#rl .opt").forEach(b=>b.onclick=()=>ruleModal(S.rules.find(r=>r.id===b.dataset.r),draw));
    document.getElementById("radd").onclick=()=>ruleModal(null,draw);
  };draw();
}
function ruleModal(r,back){
  const isNew=!r;const d=r?JSON.parse(JSON.stringify(r)):{id:uid(),qid:uid(),n:"",amount:1,mode:"daily",days:[1,2,3,4,5,6,0],on:2,off:2,every:2,start:todayKey()};
  const draw=()=>{
    openModal('<h3>'+(isNew?"Новый повтор":"Изменить повтор")+'</h3>'+
      '<div class="two"><div class="mf"><label>Название</label><input type="text" id="rn" value="'+esc(d.n)+'" placeholder="Например: обычные ролики"></div>'+
      '<div class="mf"><label>Количество в день</label><input type="number" id="ra" min="1" value="'+d.amount+'"></div></div>'+
      '<div class="mf"><label>Повторять</label><div class="chips" id="rm">'+
        [["daily","Каждый день"],["weekdays","По дням недели"],["cycle","График смен"],["everyN","Каждые N дней"]].map(x=>'<button class="chip'+(d.mode===x[0]?" on":"")+'" data-m="'+x[0]+'">'+x[1]+"</button>").join("")+
      '</div><div id="rbody" style="margin-top:12px"></div></div>'+
      '<div class="hint" id="rprev"></div>'+
      '<div class="acts">'+(isNew?"":'<button class="del" id="rdel">Удалить</button>')+'<button id="rback">Назад</button><button class="go" id="rgo">'+(isNew?"Добавить":"Сохранить")+"</button></div>");
    document.getElementById("rn").oninput=e=>{d.n=e.target.value;prev()};
    document.getElementById("ra").oninput=e=>{d.amount=Math.max(1,+e.target.value||1);prev()};
    document.querySelectorAll("#rm .chip").forEach(b=>b.onclick=()=>{d.mode=b.dataset.m;document.querySelectorAll("#rm .chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");body()});
    function body(){
      const box=document.getElementById("rbody");
      if(d.mode==="weekdays"){
        box.innerHTML='<div class="chips">'+DOW.map(x=>'<button class="chip'+((d.days||[]).includes(x[0])?" on":"")+'" data-d="'+x[0]+'">'+x[1]+"</button>").join("")+"</div>";
        box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const v=+b.dataset.d;d.days=(d.days||[]).includes(v)?d.days.filter(x=>x!==v):[...(d.days||[]),v];b.classList.toggle("on");prev()});
      }else if(d.mode==="cycle"){
        box.innerHTML='<div class="subrow"><span style="flex:1">Работаю дней</span><input type="number" id="ron" min="1" value="'+d.on+'" style="width:75px"></div>'+
          '<div class="subrow"><span style="flex:1">Выходных</span><input type="number" id="roff" min="0" value="'+d.off+'" style="width:75px"></div>'+
          '<div class="subrow"><span style="flex:1">Первый рабочий день</span><input type="date" id="rst" value="'+d.start+'" style="width:auto"></div>';
        box.querySelector("#ron").oninput=e=>{d.on=Math.max(1,+e.target.value||1);prev()};
        box.querySelector("#roff").oninput=e=>{d.off=Math.max(0,+e.target.value||0);prev()};
        box.querySelector("#rst").onchange=e=>{d.start=e.target.value;prev()};
      }else if(d.mode==="everyN"){
        box.innerHTML='<div class="subrow"><span style="flex:1">Каждые</span><input type="number" id="rev" min="1" value="'+d.every+'" style="width:75px"><span>дн.</span></div>'+
          '<div class="subrow"><span style="flex:1">Начиная с</span><input type="date" id="rst" value="'+d.start+'" style="width:auto"></div>';
        box.querySelector("#rev").oninput=e=>{d.every=Math.max(1,+e.target.value||1);prev()};
        box.querySelector("#rst").onchange=e=>{d.start=e.target.value;prev()};
      }else box.innerHTML='<div class="hint">Задача будет каждый день.</div>';
      prev();
    }
    function prev(){let out=[];for(let i=0;i<14;i++){const k=shift(todayKey(),i);if(ruleHits(d,k))out.push(SHORT[dateOf(k).getDay()]+" "+dateOf(k).getDate())}document.getElementById("rprev").innerHTML="Ближайшие 2 недели: "+(out.length?out.join(" · "):"ни одного дня")}
    body();
    document.getElementById("rback").onclick=()=>{closeModal();back()};
    if(!isNew)document.getElementById("rdel").onclick=()=>{S.rules=S.rules.filter(x=>x.id!==d.id);closeModal();scheduleSave();render();back()};
    document.getElementById("rgo").onclick=()=>{
      d.n=d.n.trim()||"Без названия";
      const twin=S.rules.find(x=>x.id!==d.id&&x.n.toLowerCase()===d.n.toLowerCase());if(twin)d.qid=twin.qid;
      if(isNew)S.rules.push(d);else Object.assign(r,d);
      S.rules.filter(x=>x.qid===d.qid).forEach(x=>x.n=d.n);
      closeModal();scheduleSave();render();back()};
  };draw();
}
document.getElementById("repeatsbtn").onclick=repeatsModal;

/* ---------- goals ---------- */
function goalsModal(first){
  const p=S.profile;let goals=p.goals.length?JSON.parse(JSON.stringify(p.goals)):[{id:uid(),t:"",dream:true}];
  openModal('<h3>Цели и награды</h3><p class="lead">Главная цель будет напоминать о себе при каждом заходе. Список радостей — для подсказок, когда закроешь что-то необязательное.</p>'+
    '<div class="mf"><label>Кем ты занимаешься</label><input type="text" id="ab" value="'+esc(p.about||"")+'" placeholder="Например: студентка, снимаю видео, веду таргет"></div>'+
    '<div class="mf"><label>Цели</label><div id="gl"></div><button class="smalladd" id="gadd" style="width:auto;padding:8px 14px">+ цель</button><div class="hint">✦ — главная мечта, она встречает тебя при входе</div></div>'+
    '<div class="mf"><label>Чем себя радуешь</label><textarea id="j" rows="3" placeholder="Через запятую: гуляю, пью кофе, сериал">'+esc((p.joys||[]).join(", "))+'</textarea></div>'+
    '<div class="acts">'+(first?'<button data-x>Потом</button>':'<button data-x>Отмена</button>')+'<button class="go" id="ogo">Сохранить</button></div>');
  const drawG=()=>{const box=document.getElementById("gl");box.innerHTML="";goals.forEach((g,i)=>{const r=document.createElement("div");r.className="goalrow";r.innerHTML='<input type="text" value="'+esc(g.t)+'" placeholder="Например: работать в финансах за рубежом"><button class="dr'+(g.dream?" on":"")+'" title="Главная мечта">✦</button><button>×</button>';const[inp]=r.querySelectorAll("input");const[dr,rm]=r.querySelectorAll("button");inp.oninput=e=>g.t=e.target.value;dr.onclick=()=>{goals.forEach(x=>x.dream=false);g.dream=true;drawG()};rm.onclick=()=>{goals.splice(i,1);if(!goals.length)goals.push({id:uid(),t:"",dream:true});drawG()};box.appendChild(r)})};
  drawG();
  document.getElementById("gadd").onclick=()=>{goals.push({id:uid(),t:"",dream:false});drawG()};
  document.getElementById("ogo").onclick=()=>{S.profile.about=document.getElementById("ab").value.trim();S.profile.goals=goals.filter(g=>g.t.trim());if(S.profile.goals.length&&!S.profile.goals.some(g=>g.dream))S.profile.goals[0].dream=true;S.profile.joys=document.getElementById("j").value.split(/[,\n;]+/).map(x=>x.trim()).filter(Boolean);S.profile.onboarded=true;if(first)S.profile.lastAsk=Date.now();S.profile.dreamHidden=null;closeModal();scheduleSave();render()};
  if(first){const skip=document.querySelector(".acts [data-x]");if(skip)skip.onclick=()=>{S.profile.onboarded=true;S.profile.lastAsk=Date.now();closeModal();scheduleSave()}}
}
document.getElementById("goalsbtn").onclick=()=>goalsModal(false);

function maybeWeeklyAsk(){
  if(!S.profile.onboarded||!S.profile.lastAsk||Date.now()-S.profile.lastAsk<7*864e5)return;
  openModal('<h3>Как прошла неделя</h3><p class="lead">Чем отдыхала? Добавлю в список наград.</p>'+
    '<div class="mf"><label>Что было приятного</label><textarea id="j" rows="3" placeholder="Через запятую"></textarea></div>'+
    '<div class="acts"><button data-x>Пропустить</button><button class="go" id="wgo">Сохранить</button></div>');
  document.getElementById("wgo").onclick=()=>{const add=document.getElementById("j").value.split(/[,\n;]+/).map(x=>x.trim()).filter(Boolean);add.forEach(a=>{if(!S.profile.joys.includes(a))S.profile.joys.push(a)});S.profile.lastAsk=Date.now();closeModal();scheduleSave()};
}

/* ---------- rewards ---------- */
const JOY_MAP=[[/^(гуля|погуля|прогул)/,"надеть наушники и пройтись любимым маршрутом"],[/коф/,"дойти до кофейни и взять что-нибудь с собой"],[/чай/,"заварить чай и посидеть без телефона"],[[/(чита|книг)/,"забраться с книгой куда-нибудь помягче"]],[/(сериал|фильм|кино)/,"поставить серию и никуда не торопиться"],[/(ванн|душ)/,"устроить долгую ванну"],[/(сплю|сон|поспа)/,"лечь пораньше и выспаться без будильника"],[/(бега|пробеж|теннис|спорт)/,"размяться и выдохнуть"],[/(пекарн|десерт|сладк|мороже)/,"дойти до пекарни за чем-нибудь тёплым"],[/(канцеляр|блокнот|шопинг)/,"зайти и купить себе что-нибудь маленькое"]];
function joyPhrase(raw){const s=(raw||"").toLowerCase().trim();for(const[re,out]of JOY_MAP)if(re.test&&re.test(s))return out;return"порадовать себя: "+s}
function reward(n){const j=S.profile.joys||[];const pick=j.length?joyPhrase(j[Math.floor(Math.random()*j.length)]):null;const h=new Date().getHours();const when=h<12?"Утро":h<17?"День":h<21?"Вечер":"Ночь";const praise=n===1?"Первая необязательная — та, что можно было не трогать.":n<4?"Уже "+n+" сверх плана — это заметно.":"Ты закрыла "+n+" необязательных. Их вообще не нужно было делать сегодня.";toast(praise+(pick?" "+when+" — самое время "+pick+".":""))}

/* ---------- data transfer ---------- */
document.getElementById("databtn").onclick=()=>{
  openModal('<h3>Данные</h3>'+
    '<div class="mf"><label>Резервная копия</label><textarea id="exp" rows="4" readonly style="font-family:var(--mono);font-size:12px">'+esc(JSON.stringify(S))+'</textarea><button class="smalladd" id="cexp" style="width:auto;padding:8px 14px">Скопировать</button></div>'+
    '<div class="mf"><label>Восстановить из копии</label><textarea id="imp" rows="4" placeholder="Вставь строку из резервной копии"></textarea><button class="smalladd" id="impgo" style="width:auto;padding:8px 14px">Заменить данные</button></div>'+
    '<div class="acts"><button data-x>Закрыть</button></div>');
  document.getElementById("cexp").onclick=()=>{const t=document.getElementById("exp");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}toast("Скопировано")};
  document.getElementById("impgo").onclick=()=>{try{const v=JSON.parse(document.getElementById("imp").value.trim());if(!v.days)throw 0;S=migrate(v);sel=todayKey();closeModal();scheduleSave();render();toast("Данные восстановлены")}catch(e){toast("Не похоже на данные планера")}};
};

/* ---------- nav ---------- */
document.getElementById("prev").onclick=()=>{sel=shift(sel,-1);render()};
document.getElementById("next").onclick=()=>{sel=shift(sel,1);render()};
document.getElementById("tobtn").onclick=()=>{sel=todayKey();render()};
document.addEventListener("keydown",e=>{if(document.getElementById("mask").classList.contains("on")){if(e.key==="Escape")closeModal();return}if(e.key==="ArrowLeft"){sel=shift(sel,-1);render()}if(e.key==="ArrowRight"){sel=shift(sel,1);render()}});

/* ---------- toast ---------- */
let tt;function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),6000)}

initAuth();
</script>
