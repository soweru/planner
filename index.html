<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Планер</title>
<style>
:root{
  --ink:#0f1424; --ink2:#4a566e; --mut:#8a94a8;
  --paper:#EEF0F5; --card:#fff; --line:#d7dbe5;
  --blue:#2B44E0; --amber:#E8820C; --green:#159A66; --red:#D8391F;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:18px 40px 80px}
.wrap{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:0 0 12px;font-weight:700;
  display:flex;align-items:center;gap:10px}
h2 .h2btn{margin-left:auto;font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink2);
  border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-weight:600}

.head{position:sticky;top:0;z-index:20;background:var(--paper);padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.pager{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pager button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:19px;line-height:1}
.pager .dt{font-size:15px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.pager .tb{width:auto;padding:0 13px;font-size:14px;height:34px;color:var(--ink2)}
.bigrow{display:flex;align-items:baseline;gap:16px;margin:8px 0 10px;flex-wrap:wrap}
.big{font-family:var(--mono);font-size:66px;font-weight:600;letter-spacing:-.04em;line-height:.9}
.bigsub{font-size:15px;color:var(--ink2);max-width:520px}
.segs{display:flex;gap:4px;height:16px}
.seg{background:#dee2ec;border-radius:3px;overflow:hidden;min-width:4px}
.seg i{display:block;height:100%;background:var(--blue);transition:width .35s}
.seg.done i{background:var(--green)}
.seg.free{background:repeating-linear-gradient(135deg,#e4e7ef 0 6px,#dbdfe9 6px 12px)}
.dream{background:#fff8ec;border:1px solid #f3ddb8;border-radius:12px;padding:10px 14px;margin:0 0 18px;
  font-size:15px;color:#7a5717;display:flex;gap:10px;align-items:center}
.dream b{color:#5d420f}
.dream button{margin-left:auto;border:none;background:none;color:#b08a45;font-size:18px;line-height:1}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:24px}
.wd{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.wd.sel{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.wd.ok{border-color:var(--green);background:#f2fbf7}
.wd.late{border-color:var(--red);background:#fef4f2}
.wd .dname{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);
  margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.wd .dname .pen{border:none;background:none;color:var(--mut);font-size:12px;padding:0 2px}
.q{display:flex;align-items:center;gap:5px;margin:5px 0;font-size:13.5px}
.q .qn{flex:1;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .qv{font-family:var(--mono);font-size:13.5px}
.q .qv.ok{color:var(--green);font-weight:700}
.q button{width:23px;height:23px;border-radius:7px;border:1px solid var(--line);background:#f2f4f9;font-size:14px;line-height:1;padding:0}
.q .adj{font-family:var(--mono);font-size:11px;color:var(--mut)}
.wd .carry{margin-top:9px;font-size:12px;color:var(--ink2);font-weight:600;background:#f1f3f8;
  border:1px solid var(--line);border-radius:8px;padding:5px 8px;width:100%;text-align:center}
.wd .carry:hover{background:#e7eaf2}
.wd .carry.undo{color:var(--mut);font-weight:500;background:none;border-style:dashed;margin-top:5px}

.cols{display:grid;grid-template-columns:1.9fr 1fr;gap:26px;align-items:start}
@media(max-width:980px){.cols{grid-template-columns:1fr}.week{grid-template-columns:repeat(4,1fr)}body{padding:12px 14px 80px}.big{font-size:54px}}

.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:11px}
.task.done{border-color:#b7e2d0;background:#f5fbf8}
.task.drag{opacity:.4}.task.over{border-color:var(--blue);border-style:dashed}
.thead{display:flex;align-items:flex-start;gap:11px}
.w{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--blue);min-width:50px;text-align:right}
.task.done .w{color:var(--green)}
.tname{flex:1;font-weight:700;font-size:17px}
.tools{display:flex;gap:4px}
.tools button{border:1px solid var(--line);background:#f4f6fa;border-radius:8px;width:29px;height:29px;font-size:13px;padding:0}
.grip{cursor:grab;color:var(--mut);font-size:15px}
.badge{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px;font-weight:800;white-space:nowrap}
.b-red{background:#ffe4e0;color:var(--red)}.b-amber{background:#fdf0dc;color:var(--amber)}
.b-grey{background:#eceff5;color:var(--ink2)}.b-blue{background:#e5e8fd;color:var(--blue)}
.meta{margin:8px 0 0 61px;font-size:13px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}
.subs{margin:10px 0 0 61px;display:flex;flex-direction:column;gap:2px}
.subs.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:2px 14px}
label.sub{display:flex;align-items:center;gap:10px;cursor:pointer;padding:5px 0;font-size:15.5px}
label.sub input{width:18px;height:18px;accent-color:var(--blue);flex:none;cursor:pointer}
label.sub .pct{font-family:var(--mono);font-size:12.5px;color:var(--mut);margin-left:auto}
label.sub.on .txt{color:var(--mut);text-decoration:line-through}
.addbtn{width:100%;border:2px dashed var(--line);background:none;border-radius:14px;padding:15px;font-size:16px;font-weight:600;color:var(--ink2)}
.addbtn:hover{border-color:var(--blue);color:var(--blue)}
.budget{font-size:14px;color:var(--ink2);margin-bottom:12px;font-family:var(--mono)}
.budget b{color:var(--blue)}.budget .over{color:var(--amber)}

.side{position:sticky;top:180px;display:flex;flex-direction:column;gap:16px}
@media(max-width:980px){.side{position:static}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.donutrow{display:flex;gap:16px;align-items:center}
.donut text{font-family:var(--mono)}
.bonus{list-style:none;margin:12px 0 0;padding:0;max-height:380px;overflow:auto}
.bonus li{border-bottom:1px solid #eef0f5}
.bonus label{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;font-size:15px;cursor:pointer}
.bonus input{width:18px;height:18px;accent-color:var(--green);flex:none;margin-top:2px}
.bonus .bt{flex:1}
.bonus .due{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.bonus .due.soon{color:var(--amber)}.bonus .due.over{color:var(--red)}
.bonus label.on .bt{color:var(--mut);text-decoration:line-through}
.bonus .ed{border:none;background:none;color:var(--mut);font-size:12px;padding:2px 4px;align-self:center}
.star{color:var(--amber)}
.smalladd{margin-top:10px;border:1px dashed var(--line);background:none;border-radius:10px;padding:9px;width:100%;font-size:14px;color:var(--ink2)}

.mask{position:fixed;inset:0;background:rgba(15,20,36,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:18px;padding:24px;width:min(680px,100%);max-height:92vh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:21px}
.lead{font-size:14px;color:var(--ink2);margin:0 0 18px;line-height:1.5}
.f{margin-bottom:18px}
.f>label{display:block;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin-bottom:8px}
.f input[type=text],.f input[type=number],.f input[type=date],.f textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fbfcfe}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#f5f7fb;border-radius:999px;padding:8px 14px;font-size:15px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
.subrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.subrow input[type=text]{flex:1}.subrow input[type=number]{width:80px}
.subrow .sp{font-family:var(--mono);font-size:13px;color:var(--mut);min-width:46px;text-align:right}
.subrow button{border:1px solid var(--line);background:#f4f6fa;border-radius:8px;min-width:34px;height:38px;padding:0 10px}
.hint{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.45}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.acts button{padding:12px 20px;border-radius:11px;border:1px solid var(--line);background:#f4f6fa;font-weight:600}
.acts .go{background:var(--ink);color:#fff;border-color:var(--ink)}
.acts .del{color:var(--red);margin-right:auto}
.range{display:flex;align-items:center;gap:12px}
.range input[type=range]{flex:1;accent-color:var(--blue)}
.range .val{font-family:var(--mono);font-size:22px;min-width:62px;text-align:right}
.opt{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;background:#fbfcfe}
.opt:hover{border-color:var(--ink)}
.opt b{display:block;font-size:16px;margin-bottom:3px}
.opt span{font-size:13px;color:var(--mut)}
.goalrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.goalrow input[type=text]{flex:1}
.goalrow .dr{border:1px solid var(--line);background:#f5f7fb;border-radius:9px;padding:9px 11px;font-size:15px}
.goalrow .dr.on{background:#fff3dd;border-color:#e8c98a;color:#8a6314}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(160%);
  background:var(--ink);color:#fff;padding:16px 22px;border-radius:14px;max-width:min(600px,92vw);
  z-index:80;transition:transform .35s;font-size:16px;box-shadow:0 10px 30px rgba(15,20,36,.3);line-height:1.45}
.toast.on{transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="head">
    <div class="pager">
      <button id="prev">‹</button>
      <div class="dt" id="dt"></div>
      <button id="next">›</button>
      <button class="tb" id="tobtn">сегодня</button>
      <button class="tb" id="goalsbtn">цели и награды</button>
      <button class="tb" id="rhythmbtn">повторы</button>
      <button class="tb" id="databtn">данные</button>
    </div>
    <div class="bigrow"><div class="big" id="big">0%</div><div class="bigsub" id="bigsub"></div></div>
    <div class="segs" id="segs"></div>
  </div>

  <div id="dreambox"></div>
  <div class="week" id="weekstrip"></div>

  <div class="cols">
    <div>
      <h2>Задачи дня</h2>
      <div class="budget" id="budget"></div>
      <div id="tasks"></div>
      <button class="addbtn" id="addtask">+ Добавить задачу</button>

    <div class="side">
      <div class="panel">
        <h2>Можно не сегодня</h2>
        <div class="donutrow">
          <svg width="104" height="104" viewBox="0 0 112 112" id="donut"></svg>
          <div style="font-size:14px;color:var(--ink2)" id="bonustxt"></div>
        </div>
        <ul class="bonus" id="bonus"></ul>
        <button class="smalladd" id="addbonus">+ Добавить необязательное</button>
      </div>
    </div>
  </div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY="planner_v3";
const DAYNAMES=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const SHORT=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const IMP=[["hi","Очень важно"],["mid","Важно"],["low","Не важно"]];
const URG=[["hi","Очень срочно"],["mid","Средней срочности"],["low","Не срочно"]];
const BADGES=[{t:"Обязательно сейчас",c:"b-red"},{t:"До вечера",c:"b-amber"},{t:"Можно перенести на завтра",c:"b-grey"},{t:"Каждый день",c:"b-blue"}];
const SUGGEST={"hi-hi":22,"hi-mid":16,"hi-low":12,"mid-hi":14,"mid-mid":10,"mid-low":7,"low-hi":8,"low-mid":5,"low-low":3};

let S=null,sel=null,dragId=null;

const uid=()=>Math.random().toString(36).slice(2,9);
function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dateOf(k){const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)}
function shift(k,n){const d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d)}
const todayKey=()=>keyOf(new Date());
function human(k){const d=dateOf(k);return DAYNAMES[d.getDay()]+" · "+d.getDate()+" "+MONTHS[d.getMonth()]}
function shortHuman(k){const d=dateOf(k);return d.getDate()+" "+MONTHS[d.getMonth()]}
const daysBetween=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
function sub(n,u){return{id:uid(),n:n,u:u||1,done:false}}
function task(n,w,imp,urg,badge,subs,grid,sid){return{id:uid(),sid:sid||null,n,w,imp,urg,badge,subs,grid:!!grid}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>(Math.round(n*10)/10).toString().replace(/\.0$/,"");

/* ---------- storage (works inside Claude and as a downloaded file) ---------- */
const store={
  ok:null,
  async test(){
    const probe="__planner_probe";
    if(typeof window.storage!=="undefined"&&window.storage){
      try{await window.storage.set(probe,"1");const r=await window.storage.get(probe);
        if(r&&r.value==="1"){this.ok="cloud";return this.ok}}catch(e){}
    }
    try{localStorage.setItem(probe,"1");
      if(localStorage.getItem(probe)==="1"){localStorage.removeItem(probe);this.ok="local";return this.ok}}catch(e){}
    this.ok=false;return false;
  },
  async get(k){
    if(typeof window.storage!=="undefined"&&window.storage){try{const r=await window.storage.get(k);if(r&&r.value)return r}catch(e){}}
    try{const v=localStorage.getItem(k);return v?{value:v}:null}catch(e){return null}
  },
  async set(k,v){
    let done=false;
    if(typeof window.storage!=="undefined"&&window.storage){try{await window.storage.set(k,v);done=true}catch(e){}}
    try{localStorage.setItem(k,v);done=true}catch(e){}
    return done;
  }
};

/* ---------- seed (only on a truly empty install) ---------- */
const daily=()=>[
  task("Челлендж по финансам — ролик дня",20,"hi","hi",{t:"Обязательно сейчас",c:"b-red"},
    [sub("Придумать озвучку",1),sub("Озвучить",1),sub("Смонтировать",3),sub("Выложить",1)],false,"s_ch"),
  task("Финансы понемногу",12,"hi","mid",{t:"Каждый день",c:"b-blue"},[sub("Теория",1),sub("Задачи",1)],false,"s_fin"),
  task("Проверить кабинеты по таргету",8,"hi","hi",{t:"Каждый день",c:"b-blue"},[sub("Пройтись по всем кабинетам",1)],false,"s_tgt"),
  task("Чекать визовый центр Испании",8,"mid","hi",{t:"Каждый день",c:"b-blue"},
    [sub("Chrome 1",1),sub("Chrome 2",1),sub("Chrome 3",1),sub("Яндекс 1",1),sub("Яндекс 2",1),sub("Яндекс 3",1),
     sub("Edge 1",1),sub("Edge 2",1),sub("Edge 3",1),sub("Safari 1",1),sub("Safari 2",1),sub("Safari 3",1)],true,"s_visa")
];
const newQuota=()=>[{id:"ob",n:"Обычные",goal:2,done:0,moved:0,extra:0},
  {id:"rz",n:"Разговорные",goal:3,done:0,moved:0,extra:0},{id:"ch",n:"Челлендж",goal:1,done:0,moved:0,extra:0}];

/* ---------- repeat rules (Google-Calendar style) ---------- */
const defaultRules=()=>[
  {id:uid(),qid:"ob",n:"Обычные",amount:2,mode:"weekdays",days:[1,3,5],on:2,off:2,every:2,start:"2026-08-10"},
  {id:uid(),qid:"ob",n:"Обычные",amount:3,mode:"weekdays",days:[2,4,6,0],on:2,off:2,every:2,start:"2026-08-10"},
  {id:uid(),qid:"rz",n:"Разговорные",amount:3,mode:"weekdays",days:[1,3,5,0],on:2,off:2,every:2,start:"2026-08-10"},
  {id:uid(),qid:"ch",n:"Челлендж",amount:1,mode:"daily",days:[1,2,3,4,5,6,0],on:2,off:2,every:2,start:"2026-08-10"}
];
function ruleHits(r,k){
  if(r.mode==="daily")return true;
  if(r.mode==="weekdays")return (r.days||[]).includes(dateOf(k).getDay());
  const n=daysBetween(r.start||k,k);
  if(r.mode==="cycle"){const len=Math.max(1,(+r.on||1)+(+r.off||0));
    return (((n%len)+len)%len)<(+r.on||1)}
  if(r.mode==="everyN"){const e=Math.max(1,+r.every||1);return (((n%e)+e)%e)===0}
  return false;
}
function goalFor(qid,k){
  return (S.rules||[]).filter(r=>r.qid===qid&&ruleHits(r,k))
    .reduce((a,r)=>a+Math.max(0,+r.amount||0),0);
}
function applyRules(k,d){
  const ids=[...new Set((S.rules||[]).map(r=>r.qid))];
  ids.forEach(qid=>{
    const rule=(S.rules||[]).find(r=>r.qid===qid);
    let q=d.quota.find(x=>x.id===qid);
    if(!q){q={id:qid,n:rule.n,goal:0,done:0,moved:0,extra:0};d.quota.push(q)}
    q.n=rule.n;
    if(!q.manual)q.goal=goalFor(qid,k);
  });
}
/* a quota row is shown only if something is actually required or already done */
const quotaVisible=q=>need(q)>0||q.done>0;
function seed(){
  return {days:{},bonus:[
    {id:uid(),n:"Скачать видео для монтажа (домашка курса)",star:false,due:null,doneOn:null},
    {id:uid(),n:"Посмотреть новые уроки по монтажу",star:false,due:null,doneOn:null},
    {id:uid(),n:"Съездить на море, если погода хорошая",star:true,due:null,doneOn:null}
  ],profile:{onboarded:false,goals:[],joys:[],about:"",lastAsk:null,dreamShown:null},carries:[],rules:defaultRules()};
}

/* ---------- migration from earlier versions ---------- */
function migrate(o){
  if(!o||typeof o!=="object")return seed();
  const s={days:o.days||{},bonus:[],carries:o.carries||[],rules:o.rules||defaultRules(),
    profile:{onboarded:false,goals:[],joys:[],about:"",lastAsk:null,dreamShown:null}};
  const p=o.profile||{};
  s.profile.onboarded=!!p.onboarded;
  s.profile.joys=Array.isArray(p.joys)?p.joys:[];
  s.profile.about=p.about||"";
  s.profile.lastAsk=p.lastAsk||null;
  if(Array.isArray(p.goals))s.profile.goals=p.goals.map(g=>typeof g==="string"?{id:uid(),t:g,dream:false}:g);
  else if(typeof p.goals==="string"&&p.goals.trim())
    s.profile.goals=p.goals.split(/[,\n;]+/).map(t=>t.trim()).filter(Boolean).map(t=>({id:uid(),t:t,dream:false}));
  if(s.profile.goals.length&&!s.profile.goals.some(g=>g.dream))s.profile.goals[0].dream=true;

  // old per-day bonus arrays -> one global list, completion pinned to its day
  const seen={};
  Object.keys(s.days).forEach(k=>{
    const d=s.days[k];
    (d.quota||[]).forEach(q=>{q.moved=q.moved||0;q.extra=q.extra||0});
    if(Array.isArray(d.bonus)){
      d.bonus.forEach(b=>{
        const name=String(b.n||"").replace(/^★\s*/,"").trim();
        if(!name)return;
        if(b.done){s.bonus.push({id:uid(),n:name,star:/^★/.test(b.n||""),due:null,doneOn:k});return}
        if(seen[name.toLowerCase()])return;
        seen[name.toLowerCase()]=1;
        s.bonus.push({id:uid(),n:name,star:/^★/.test(b.n||""),due:null,doneOn:null});
      });
      delete d.bonus;
    }
    (d.tasks||[]).forEach(t=>{if(!("sid" in t))t.sid=null});
  });
  if(!s.bonus.length)s.bonus=seed().bonus;
  return s;
}

async function load(){
  await store.test();
  let raw=null;
  try{const r=await store.get(KEY);raw=r&&r.value?JSON.parse(r.value):null}catch(e){}
  S=raw?migrate(raw):seed();
  sel=todayKey();
  render();
  if(store.ok===false){storageWarning();return}
  maybeWeeklyAsk();dreamPing();
}

    '<p class="lead"><b>Что помогает:</b> открыть планер в Chrome вместо Safari — там локальные файлы обычно сохраняют нормально. Либо после каждой сессии заходить в «данные», копировать резервную строку и хранить её в заметках.</p>'+
    '<p class="lead">Пока эта плашка появляется при запуске, работать можно, но только в пределах одной вкладки: не перезагружай её.</p>'+

let st,warned=false;
function save(){clearTimeout(st);st=setTimeout(async()=>{
  const ok=await store.set(KEY,JSON.stringify(S));
  if(!ok&&!warned){warned=true;toast("Внимание: браузер не сохраняет данные. Зайди в «данные» и скопируй резервную строку, иначе всё пропадёт при перезагрузке.")}
},250)}

function day(k){
  if(!S.days[k])S.days[k]={tasks:daily(),quota:[]};
  const d=S.days[k];
  if(!d.tasks)d.tasks=[];
  if(!d.quota)d.quota=[];
  d.quota.forEach(q=>{q.moved=q.moved||0;q.extra=q.extra||0});
  applyRules(k,d);
  return d;
}
const planned=k=>day(k).tasks.reduce((a,t)=>a+(+t.w||0),0);
const need=q=>Math.max(0,(+q.goal||0)-(q.moved||0)+(q.extra||0));
function prog(t){const tot=t.subs.reduce((a,s)=>a+(+s.u||0),0)||1;
  return t.subs.reduce((a,s)=>a+(s.done?(+s.u||0):0),0)/tot*100}

/* ---------- render ---------- */
function render(){
  const d=day(sel),P=planned(sel);
  document.getElementById("dt").textContent=human(sel);
  let earned=0;d.tasks.forEach(t=>earned+=t.w*prog(t)/100);
  const pct=P?Math.round(earned/P*100):0;
  const b=document.getElementById("big");
  b.textContent=pct+"%";b.style.color=pct>=100?"var(--green)":"var(--ink)";
  document.getElementById("bigsub").textContent=
    P===0?"на этот день пока ничего не запланировано":
    pct>=100?"весь план дня закрыт":
    "закрыто из плана дня · осталось "+fmt(P-earned)+" из "+P+" запланированных процентов";
  document.getElementById("budget").innerHTML="Запланировано <b>"+P+"%</b>"+
    (P>100?' <span class="over">· овер-планинг, это нормально: проценты показывают, какую долю плана ты закрыла</span>'
      :P<100?" · свободно "+(100-P)+"%":"");

  const segs=document.getElementById("segs");segs.innerHTML="";
  d.tasks.forEach(t=>{const p=prog(t),e=document.createElement("div");
    e.className="seg"+(p>=100?" done":"");e.style.flexGrow=t.w;e.title=t.n+" — "+t.w+"%";
    e.innerHTML='<i style="width:'+p+'%"></i>';segs.appendChild(e)});
  if(P<100){const f=document.createElement("div");f.className="seg free";f.style.flexGrow=100-P;segs.appendChild(f)}

  renderDream();renderWeek();renderTasks();renderBonus();
}

function renderDream(){
  const box=document.getElementById("dreambox");
  const dream=S.profile.goals.find(g=>g.dream);
  if(!dream||S.profile.dreamHidden===todayKey()){box.innerHTML="";return}
  box.innerHTML='<div class="dream"><span>✦</span><div>Не забывай, ради чего всё это: <b>'+esc(dream.t)+'</b></div>'+
    '<button title="Скрыть на сегодня">×</button></div>';
  box.querySelector("button").onclick=()=>{S.profile.dreamHidden=todayKey();save();renderDream()};
}

function renderWeek(){
  const box=document.getElementById("weekstrip");box.innerHTML="";
  const dow=dateOf(sel).getDay(),start=shift(sel,-((dow+6)%7)),TK=todayKey();
  for(let i=0;i<7;i++){
    const k=shift(start,i),d=day(k),dt=dateOf(k);
    const vis=d.quota.filter(quotaVisible);
    const ok=vis.length>0&&vis.every(q=>q.done>=need(q));
    const late=!ok&&vis.length>0&&k<TK;
    const el=document.createElement("div");
    el.className="wd"+(k===sel?" sel":"")+(ok?" ok":late?" late":"");
    const hd=document.createElement("div");hd.className="dname";
    hd.innerHTML="<span>"+SHORT[dt.getDay()]+" "+dt.getDate()+"</span>"+
      (ok?'<span style="color:var(--green)">✓</span>':'')+'<button class="pen">✎</button>';
    hd.querySelector(".pen").onclick=ev=>{ev.stopPropagation();quotaModal(k)};
    el.appendChild(hd);
    vis.forEach(q=>{
      const adj=(q.extra||0)-(q.moved||0);
      const r=document.createElement("div");r.className="q";
      r.innerHTML='<button data-a="-">−</button><button data-a="+">+</button><span class="qn">'+esc(q.n)+
        '</span><span class="qv'+(q.done>=need(q)?" ok":"")+'">'+q.done+"/"+q.goal+"</span>"+
        (adj?'<span class="adj">'+(adj>0?"+":"")+adj+"</span>":"");
      r.querySelectorAll("button").forEach(bt=>bt.onclick=ev=>{ev.stopPropagation();
        q.done=Math.max(0,q.done+(bt.dataset.a==="+"?1:-1));save();render()});
      el.appendChild(r);
    });
    if(vis.some(q=>q.done<need(q))){
      const c=document.createElement("button");c.className="carry";c.textContent="Перенести невыполненное";
      c.onclick=ev=>{ev.stopPropagation();carry(k)};el.appendChild(c);
    }
    if(S.carries.some(c=>c.from===k||c.to===k)){
      const u=document.createElement("button");u.className="carry undo";u.textContent="Отменить перенос";
      u.onclick=ev=>{ev.stopPropagation();undoCarry(k)};el.appendChild(u);
    }
    el.onclick=()=>{sel=k;render()};
    box.appendChild(el);
  }
}

function renderTasks(){
  const box=document.getElementById("tasks");box.innerHTML="";
  const d=day(sel);
  d.tasks.forEach((t,idx)=>{
    const p=prog(t),tot=t.subs.reduce((a,s)=>a+(+s.u||0),0)||1;
    const el=document.createElement("div");
    el.className="task"+(p>=100?" done":"");el.draggable=true;
    const impL=(IMP.find(x=>x[0]===t.imp)||["","—"])[1],urgL=(URG.find(x=>x[0]===t.urg)||["","—"])[1];
    el.innerHTML='<div class="thead"><span class="grip">⠿</span><div class="w">'+t.w+'%</div>'+
      '<div class="tname">'+esc(t.n)+'</div>'+
      (t.badge?'<span class="badge '+t.badge.c+'">'+esc(t.badge.t)+'</span>':'')+
      '<div class="tools"><button data-e="up">↑</button><button data-e="dn">↓</button><button data-e="ed">✎</button></div></div>'+
      '<div class="meta"><span>'+impL+'</span><span>'+urgL+'</span><span>'+Math.round(p)+'% выполнено</span></div>'+
      '<div class="subs'+(t.grid?" grid":"")+'"></div>';
    const sc=el.querySelector(".subs");
    t.subs.forEach(s=>{
      const l=document.createElement("label");l.className="sub"+(s.done?" on":"");
      l.innerHTML='<input type="checkbox"'+(s.done?" checked":"")+'><span class="txt">'+esc(s.n)+
        '</span><span class="pct">'+fmt(t.w*s.u/tot)+'%</span>';
      l.querySelector("input").onchange=e=>{s.done=e.target.checked;save();render()};
      sc.appendChild(l);
    });
    el.querySelector('[data-e="ed"]').onclick=()=>taskModal(t);
    el.querySelector('[data-e="up"]').onclick=()=>{if(idx>0){d.tasks.splice(idx-1,0,d.tasks.splice(idx,1)[0]);save();render()}};
    el.querySelector('[data-e="dn"]').onclick=()=>{if(idx<d.tasks.length-1){d.tasks.splice(idx+1,0,d.tasks.splice(idx,1)[0]);save();render()}};
    el.ondragstart=()=>{dragId=t.id;el.classList.add("drag")};
    el.ondragend=()=>{el.classList.remove("drag");document.querySelectorAll(".task").forEach(x=>x.classList.remove("over"))};
    el.ondragover=e=>{e.preventDefault();el.classList.add("over")};
    el.ondragleave=()=>el.classList.remove("over");
    el.ondrop=e=>{e.preventDefault();const from=d.tasks.findIndex(x=>x.id===dragId),to=d.tasks.findIndex(x=>x.id===t.id);
      if(from>-1&&to>-1&&from!==to){d.tasks.splice(to,0,d.tasks.splice(from,1)[0]);save();render()}};
    box.appendChild(el);
  });
}

/* ---------- bonus: one global list, completion pinned to a day ---------- */
function visibleBonus(k){return S.bonus.filter(b=>!b.doneOn||b.doneOn===k)}
function dueLabel(b,k){
  if(!b.due)return"";
  const n=daysBetween(k,b.due);
  if(n<0)return['<span class="due over">просрочено · было до '+shortHuman(b.due)+"</span>"];
  if(n===0)return['<span class="due soon">сегодня последний день</span>'];
  if(n<=3)return['<span class="due soon">до '+shortHuman(b.due)+" · осталось "+n+(n===1?" день":n<5?" дня":" дней")+"</span>"];
  return['<span class="due">до '+shortHuman(b.due)+"</span>"];
}

  document.getElementById("bonustxt").innerHTML="<b>"+done+" за этот день</b><br>Список общий: закрытое исчезает из следующих дней, но остаётся в том, где ты его отметила.";

/* ---------- carry ---------- */
function carry(k){
  const d=day(k),miss=d.quota.filter(q=>quotaVisible(q)&&q.done<need(q));
  openModal('<h3>Перенести невыполненное</h3>'+
    '<p class="lead">Не закрыто: '+miss.map(q=>(need(q)-q.done)+" "+q.n.toLowerCase()).join(", ")+
    '. План дня останется прежним — рядом появится пометка со сдвигом. Этот день закроется, а у выбранного норма вырастет. Перенос всегда можно отменить.</p>'+
    '<div class="f"><label>Перенести на</label><input type="date" id="cdate" value="'+shift(k,1)+'"></div>'+
    '<div class="acts"><button data-x>Отмена</button><button class="go" id="cgo">Перенести</button></div>');
  document.getElementById("cgo").onclick=()=>{
    const to=document.getElementById("cdate").value;if(!to||to===k)return;
    const t=day(to);
    miss.forEach(q=>{const left=need(q)-q.done;q.moved+=left;
      let tq=t.quota.find(x=>x.id===q.id);
      if(tq)tq.extra+=left;else t.quota.push({id:q.id,n:q.n,goal:0,done:0,moved:0,extra:left});
      S.carries.push({id:uid(),from:k,to:to,qid:q.id,n:q.n,amount:left})});
    closeModal();save();render();
    toast("Перенесено. "+SHORT[dateOf(k).getDay()]+" закрыт, у "+SHORT[dateOf(to).getDay()]+" норма выросла.");
  };
}
function undoCarry(k){
  const list=S.carries.filter(c=>c.from===k||c.to===k);
  openModal('<h3>Отменить перенос</h3>'+
    '<p class="lead">Если ты на самом деле всё выложила и просто забыла отметить — верни норму на место.</p>'+
    '<div id="clist">'+list.map(c=>'<div class="subrow"><span style="flex:1">'+c.amount+" "+esc(c.n.toLowerCase())+
      " · "+SHORT[dateOf(c.from).getDay()]+" → "+SHORT[dateOf(c.to).getDay()]+
      '</span><button data-c="'+c.id+'">вернуть</button></div>').join("")+"</div>"+
    '<div class="acts"><button data-x>Закрыть</button></div>');
  document.querySelectorAll("#clist button").forEach(b=>b.onclick=()=>{
    const c=S.carries.find(x=>x.id===b.dataset.c);if(!c)return;
    const f=day(c.from).quota.find(q=>q.id===c.qid),t=day(c.to).quota.find(q=>q.id===c.qid);
    if(f)f.moved=Math.max(0,f.moved-c.amount);
    if(t)t.extra=Math.max(0,t.extra-c.amount);
    S.carries=S.carries.filter(x=>x.id!==c.id);
    closeModal();save();render();toast("Перенос отменён, норма вернулась на место.")});
}

      '<div class="hint">Вес — в «единичках» по времени: обычный шаг = 1, вдвое длиннее = 2, чуть тяжелее = 1,5. Проценты внутри задачи считаются сами.</div></div>'+
    (isNew?"":'<div class="f"><label>Перенести на другой день</label><input type="date" id="mv" value="'+sel+'"></div>')+
    '<div class="acts">'+(isNew?"":'<button class="del" id="del">Удалить</button>')+
    '<button data-x>Отмена</button><button class="go" id="go">'+(isNew?"Добавить":"Сохранить")+"</button></div>");

  const wr=document.getElementById("wr"),wv=document.getElementById("wv"),wh=document.getElementById("wh");
  const others=planned(sel)-(isNew?0:t.w);
  const upd=()=>{const tot=others+draft.w;
    wh.innerHTML="В этом дне уже "+others+"% в других задачах. С этой задачей выйдет <b>"+tot+"%</b>"+
      (tot>100?" — это овер-планинг. Ограничения нет: проценты просто покажут, какую долю плана ты закрыла."
        :", остаётся свободно "+(100-tot)+"%.");
    wv.textContent=draft.w+"%"};
  wr.oninput=()=>{draft.w=+wr.value;touched=true;upd();drawSubs()};upd();

  function pick(id,field){document.querySelectorAll("#"+id+" .chip").forEach(b=>b.onclick=()=>{
    draft[field]=b.dataset.v;document.querySelectorAll("#"+id+" .chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    if(!touched&&draft.imp&&draft.urg){draft.w=SUGGEST[draft.imp+"-"+draft.urg];wr.value=draft.w;upd();drawSubs()}})}
  pick("imp","imp");pick("urg","urg");

  document.querySelectorAll("#bd .chip").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#bd .chip").forEach(x=>x.classList.remove("on"));
    const own=document.getElementById("ownb");
    if(b.dataset.i==="none"){own.style.display="none";draft.badge=null;return}
    b.classList.add("on");
    if(b.dataset.i==="own"){own.style.display="block";own.focus();draft.badge={t:own.value||"Своя плашка",c:"b-blue"}}
    else{own.style.display="none";draft.badge=BADGES[+b.dataset.i]}});
  document.getElementById("ownb").oninput=e=>{draft.badge={t:e.target.value,c:"b-blue"}};

  function drawSubs(){
    const box=document.getElementById("subs");box.innerHTML="";
    const tot=draft.subs.reduce((a,s)=>a+(+s.u||0),0)||1;
    draft.subs.forEach((s,i)=>{
      const r=document.createElement("div");r.className="subrow";
      r.innerHTML='<input type="text" placeholder="Шаг '+(i+1)+'" value="'+esc(s.n)+'">'+
        '<input type="number" min="0.5" step="0.5" value="'+s.u+'"><span class="sp">'+fmt(draft.w*s.u/tot)+"%</span><button>×</button>";
      const[nm,un]=r.querySelectorAll("input");
      nm.oninput=e=>s.n=e.target.value;
      un.oninput=e=>{s.u=+e.target.value||1;drawSubs()};
      r.querySelector("button").onclick=()=>{if(draft.subs.length>1){draft.subs.splice(i,1);drawSubs()}};
      box.appendChild(r)});
  }
  drawSubs();
  document.getElementById("addsub").onclick=()=>{draft.subs.push(sub("",1));drawSubs()};
  if(!isNew)document.getElementById("del").onclick=()=>deleteModal(t);
  document.getElementById("go").onclick=()=>{
    draft.n=document.getElementById("tn").value.trim()||"Без названия";
    draft.subs=draft.subs.filter(s=>s.n.trim());
    if(!draft.subs.length)draft.subs=[sub("Сделать",1)];
    if(isNew){draft.id=uid();d.tasks.push(draft)}
    else{const mv=document.getElementById("mv").value;Object.assign(t,draft);
      if(mv&&mv!==sel){day(mv).tasks.push(t);d.tasks=d.tasks.filter(x=>x.id!==t.id);
        toast("Задача перенесена на "+human(mv).toLowerCase())}}
    closeModal();save();render()};
}
document.getElementById("addtask").onclick=()=>taskModal(null);

/* ---------- delete: this day / this and later / everywhere ---------- */
function matches(x,t){return t.sid?x.sid===t.sid:x.n===t.n}
function countIn(t,from){
  let n=0;Object.keys(S.days).forEach(k=>{if(from&&k<from)return;
    n+=(S.days[k].tasks||[]).filter(x=>matches(x,t)).length});return n}
function deleteModal(t){
  const later=countIn(t,sel),all=countIn(t,null);
  openModal('<h3>Удалить задачу</h3>'+
    '<p class="lead">«'+esc(t.n)+'» встречается в '+all+" "+(all===1?"дне":all<5?"днях":"днях")+
    '. Выбери, что удалить.</p>'+
    '<button class="opt" data-s="one"><b>Только в этом дне</b><span>Останется во всех остальных днях</span></button>'+
    '<button class="opt" data-s="fwd"><b>В этом и всех следующих</b><span>Затронет '+later+" "+(later===1?"день":later<5?"дня":"дней")+
      ' · прошлые дни останутся как есть</span></button>'+
    '<button class="opt" data-s="all"><b>Во всех днях</b><span>Затронет '+all+" "+(all===1?"день":all<5?"дня":"дней")+
      ' · включая уже прошедшие</span></button>'+
    '<div class="acts"><button data-x>Отмена</button></div>');
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const s=b.dataset.s;
    if(s==="one")day(sel).tasks=day(sel).tasks.filter(x=>x.id!==t.id);
    else Object.keys(S.days).forEach(k=>{
      if(s==="fwd"&&k<sel)return;
      S.days[k].tasks=(S.days[k].tasks||[]).filter(x=>!matches(x,t))});
    closeModal();save();render();
    toast(s==="one"?"Удалено в этом дне.":s==="fwd"?"Удалено в этом и следующих днях.":"Удалено везде.")});
}

    '<div class="f"><label>Чем ты себя радуешь</label>'+
    '<textarea id="j" rows="3" placeholder="Пиши как привычно: гуляю, пью кофе, читаю, сериал, ванна">'+esc((p.joys||[]).join(", "))+'</textarea>'+
    '<div class="hint">Можно просто перечислить через запятую — я сама переведу это в нормальное предложение. Раз в неделю спрошу, как ты отдыхала, и дополню список.</div></div>'+

/* ---------- natural Russian for rewards ---------- */
const JOY_MAP=[
  [/^(гуля|погуля|прогул)/,"надеть наушники и пройтись любимым маршрутом"],
  [/коф/,"дойти до кофейни и взять что-нибудь с собой"],
  [/чай/,"заварить чай и посидеть без телефона"],
  [/(чита|книг)/,"забраться с книгой куда-нибудь помягче"],
  [/(сериал|смотрю|фильм|кино)/,"поставить серию и никуда не торопиться"],
  [/(ванн|душ)/,"устроить долгую ванну"],
  [/(сплю|сон|поспа|высып)/,"лечь пораньше и выспаться без будильника"],
  [/(музык|слуша)/,"включить музыку погромче и ничего не делать"],
  [/(бега|пробеж|спорт|зал|йог|теннис)/,"размяться и выдохнуть"],
  [/(рису|скетч|творч)/,"порисовать для себя, без цели"],
  [/(пекарн|десерт|сладк|торт|булоч)/,"дойти до пекарни за чем-нибудь тёплым"],
  [/(морожен|айскрим)/,"взять мороженое"],
  [/(готов|ужин|обед|поесть|еда|ем|вкусн)/,"приготовить что-то вкусное себе"],
  [/(канцеляр|блокнот|ручк|магазин|шопинг|покупа)/,"зайти и купить себе что-нибудь маленькое и приятное"],
  [/(друз|подруг|созвон|поболта)/,"списаться с кем-то из своих"],
  [/(игр|поигра)/,"поиграть"],
  [/(мор|пляж|вода)/,"выбраться поближе к воде"],
  [/(маникюр|уход|маск|космет)/,"устроить себе уход"],
  [/(сериал|тикток|листа|полежа|ничего)/,"честно полежать и ничего не делать"]
];
function joyPhrase(raw){
  const s=raw.toLowerCase().trim();
  for(const[re,out]of JOY_MAP)if(re.test(s))return out;
  if(/(ю|у)$/.test(s))return "вернуться к тому, что любишь — "+s.replace(/ю$/,"ть").replace(/у$/,"ть");
  return "устроить себе то, что ты любишь: "+s;
}
function partOfDay(){const h=new Date().getHours();
  return h<11?"morning":h<16?"day":h<21?"evening":"night"}
function reward(n){
  const joys=S.profile.joys||[];
  const j=joys.length?joyPhrase(joys[Math.floor(Math.random()*joys.length)]):null;
  const pod=partOfDay();
  const praise=n===1?["Одна необязательная закрыта — та, которую можно было спокойно не трогать сегодня.",
      "Первая сверх плана. Приятно, когда делаешь не потому, что горит."]:
    n<4?["Уже "+n+" необязательных за день — это заметно больше, чем требовалось.",
      n+" сверх плана. День явно вышел не пустой."]:
    ["Ты закрыла "+n+" необязательных задач. Их вообще-то можно было отложить — а ты не отложила.",
     n+" сверх плана за один день. Это уже не «между делом»."];
  const when=pod==="morning"?"Впереди целый день, но пауза уже заслужена: "
    :pod==="day"?"Середина дня — самое время выдохнуть: "
    :pod==="evening"?"Вечер, и это можно себе позволить прямо сейчас: "
    :"Поздно, так что самое время закрыть ноутбук: ";
  const tail=j?" "+when+j+".":" Расскажи в «целях и наградах», чем ты себя радуешь, — буду подсказывать конкретнее.";
  toast(praise[Math.floor(Math.random()*praise.length)]+tail);
}
let tt;function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("on");
  clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),6500)}

/* ---------- repeat editor ---------- */
const DOW=[[1,"Пн"],[2,"Вт"],[3,"Ср"],[4,"Чт"],[5,"Пт"],[6,"Сб"],[0,"Вс"]];
function ruleText(r){
  const a=r.amount+" шт";
  if(r.mode==="daily")return a+" каждый день";
  if(r.mode==="weekdays"){const d=DOW.filter(x=>(r.days||[]).includes(x[0])).map(x=>x[1]);
    return d.length?a+" по "+d.join(", "):a+" — дни не выбраны"}
  if(r.mode==="cycle")return a+" по графику "+r.on+"/"+r.off+", с "+shortHuman(r.start);
  return a+" каждые "+r.every+" дн., с "+shortHuman(r.start);
}
function rhythmModal(){
  if(!S.rules)S.rules=defaultRules();
  const draw=()=>{
    openModal('<h3>Повторяющиеся задачи</h3>'+
      '<p class="lead">Как в календаре: задача и её повтор. Каждый день, по выбранным дням недели, по графику смен или каждые N дней. В дни, когда задача не повторяется, она просто не показывается.</p>'+
      '<div id="rl">'+(S.rules.length?S.rules.map(r=>

      '<button class="smalladd" id="radd" style="width:auto;padding:9px 16px">+ повторяющаяся задача</button>'+
      '<div class="acts"><button class="go" data-x>Готово</button></div>');

    document.getElementById("radd").onclick=()=>ruleModal(null,draw);

function ruleModal(r,back){
  const isNew=!r;
  const d=r?JSON.parse(JSON.stringify(r)):
    {id:uid(),qid:uid(),n:"",amount:1,mode:"daily",days:[1,2,3,4,5,6,0],on:2,off:2,every:2,start:todayKey()};
  const draw=()=>{
    openModal('<h3>'+(isNew?"Новая повторяющаяся задача":"Повтор")+'</h3>'+
      '<div class="two"><div class="f"><label>Название</label>'+
      '<input type="text" id="rn" value="'+esc(d.n)+'" placeholder="Например: разговорные"></div>'+
      '<div class="f"><label>Сколько за день</label><input type="number" id="ra" min="1" value="'+d.amount+'"></div></div>'+
      '<div class="f"><label>Повторять</label><div class="chips" id="rm">'+
        [["daily","Каждый день"],["weekdays","По дням недели"],["cycle","График смен"],["everyN","Каждые N дней"]]
          .map(x=>'<button class="chip'+(d.mode===x[0]?" on":"")+'" data-m="'+x[0]+'">'+x[1]+"</button>").join("")+
        '</div><div id="rbody" style="margin-top:14px"></div></div>'+
      '<div class="hint" id="rprev"></div>'+
      '<div class="acts">'+(isNew?"":'<button class="del" id="rdel">Удалить</button>')+
      '<button data-x id="rback">Назад</button><button class="go" id="rgo">'+(isNew?"Добавить":"Сохранить")+"</button></div>");

    document.getElementById("rn").oninput=e=>{d.n=e.target.value;prev()};
    document.getElementById("ra").oninput=e=>{d.amount=Math.max(1,+e.target.value||1);prev()};
    document.querySelectorAll("#rm .chip").forEach(b=>b.onclick=()=>{
      d.mode=b.dataset.m;document.querySelectorAll("#rm .chip").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");body()});

    function body(){
      const box=document.getElementById("rbody");
      if(d.mode==="weekdays"){
        box.innerHTML='<div class="chips">'+DOW.map(x=>'<button class="chip'+
          ((d.days||[]).includes(x[0])?" on":"")+'" data-d="'+x[0]+'">'+x[1]+"</button>").join("")+"</div>";
        box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
          const v=+b.dataset.d;d.days=(d.days||[]).includes(v)?d.days.filter(x=>x!==v):d.days.concat(v);
          b.classList.toggle("on");prev()});
      }else if(d.mode==="cycle"){
        box.innerHTML='<div class="subrow"><span style="flex:1;font-size:15px">Работаю дней</span>'+
          '<input type="number" id="ron" min="1" value="'+d.on+'" style="width:80px"></div>'+
          '<div class="subrow"><span style="flex:1;font-size:15px">Потом выходных</span>'+
          '<input type="number" id="roff" min="0" value="'+d.off+'" style="width:80px"></div>'+
          '<div class="subrow"><span style="flex:1;font-size:15px">Первый рабочий день</span>'+
          '<input type="date" id="rst" value="'+d.start+'" style="width:auto"></div>'+
          '<div class="hint">Для графика 2/2 поставь 2 и 2, для 3/1 — 3 и 1.</div>';
        box.querySelector("#ron").oninput=e=>{d.on=Math.max(1,+e.target.value||1);prev()};
        box.querySelector("#roff").oninput=e=>{d.off=Math.max(0,+e.target.value||0);prev()};
        box.querySelector("#rst").onchange=e=>{d.start=e.target.value;prev()};
      }else if(d.mode==="everyN"){
        box.innerHTML='<div class="subrow"><span style="flex:1;font-size:15px">Каждые</span>'+
          '<input type="number" id="rev" min="1" value="'+d.every+'" style="width:80px"><span style="font-size:15px">дн.</span></div>'+
          '<div class="subrow"><span style="flex:1;font-size:15px">Начиная с</span>'+
          '<input type="date" id="rst" value="'+d.start+'" style="width:auto"></div>';
        box.querySelector("#rev").oninput=e=>{d.every=Math.max(1,+e.target.value||1);prev()};
        box.querySelector("#rst").onchange=e=>{d.start=e.target.value;prev()};
      }else box.innerHTML='<div class="hint">Задача будет появляться каждый день.</div>';
      prev();
    }
    function prev(){
      let out=[];for(let i=0;i<14;i++){const k=shift(todayKey(),i);
        if(ruleHits(d,k))out.push(SHORT[dateOf(k).getDay()]+" "+dateOf(k).getDate())}
      document.getElementById("rprev").innerHTML="Ближайшие две недели: "+
        (out.length?out.join(" · "):"ни одного дня — проверь настройки");
    }
    body();
    document.getElementById("rback").onclick=()=>{closeModal();back()};
    if(!isNew)document.getElementById("rdel").onclick=()=>{
      S.rules=S.rules.filter(x=>x.id!==d.id);
      if(!S.rules.some(x=>x.qid===d.qid))
        Object.keys(S.days).forEach(k=>{S.days[k].quota=(S.days[k].quota||[]).filter(q=>q.id!==d.qid)});
      closeModal();save();render();back()};
    document.getElementById("rgo").onclick=()=>{
      d.n=d.n.trim()||"Без названия";
      const twin=S.rules.find(x=>x.id!==d.id&&x.n.toLowerCase()===d.n.toLowerCase());
      if(twin)d.qid=twin.qid;
      if(isNew)S.rules.push(d);else Object.assign(r,d);
      S.rules.filter(x=>x.qid===d.qid).forEach(x=>x.n=d.n);
      closeModal();save();render();back()};
  };
  draw();
}
document.getElementById("rhythmbtn").onclick=rhythmModal;

/* ---------- data transfer ---------- */
const SNIPPET="prompt('Скопируй это (Cmd+C):', JSON.stringify(S))";
function dataModal(){
  openModal('<h3>Перенос данных</h3>'+
    '<p class="lead">Если старый планер остался в другом файле, данные можно забрать оттуда и вставить сюда. Ничего не потеряется: импорт можно отменить, пока ты не нажала «Заменить».</p>'+
    '<div class="f"><label>Шаг 1 · забрать из старого файла</label>'+
    '<div class="hint" style="margin:0 0 8px">Открой вкладку со старым планером — <b>не перезагружая её</b> — и нажми Cmd+Option+C. В Safari консоль сначала включается в Настройках → Дополнения → «Показывать функции для веб-разработчиков». Вставь строку ниже, нажми Enter и скопируй содержимое окошка.</div>'+
    '<textarea id="snip" rows="4" readonly style="font-family:var(--mono);font-size:12px">'+esc(SNIPPET)+'</textarea>'+
    '<button class="smalladd" id="csnip" style="width:auto;padding:9px 16px">Скопировать строку</button></div>'+
    '<div class="f"><label>Шаг 2 · вставить сюда</label>'+
    '<textarea id="imp" rows="4" placeholder="Вставь скопированное сюда"></textarea>'+
    '<div class="acts" style="margin-top:12px"><button class="go" id="impgo">Заменить данные</button></div></div>'+
    '<div class="f"><label>Резервная копия этого планера</label>'+
    '<textarea id="exp" rows="3" readonly>'+esc(JSON.stringify(S))+'</textarea>'+
    '<div class="hint">Сохрани в заметки — это вся твоя история одной строкой.</div>'+
    '<button class="smalladd" id="cexp" style="width:auto;padding:9px 16px">Скопировать копию</button></div>'+
    '<div class="acts"><button data-x>Закрыть</button></div>');
  const copyFrom=id=>{const t=document.getElementById(id);t.select();
    try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}
    toast("Скопировано.")};
  document.getElementById("csnip").onclick=()=>copyFrom("snip");
  document.getElementById("cexp").onclick=()=>copyFrom("exp");
  document.getElementById("impgo").onclick=()=>{
    const v=document.getElementById("imp").value.trim();
    if(!v){toast("Поле пустое — вставь скопированную строку.");return}
    let parsed;try{parsed=JSON.parse(v)}catch(e){toast("Не похоже на данные планера. Скопируй строку целиком, от { до }.");return}
    if(!parsed||!parsed.days){toast("В этой строке нет дней планера.");return}
    S=migrate(parsed);sel=todayKey();closeModal();save();render();
    toast("Данные перенесены: "+Object.keys(S.days).length+" дней, "+S.bonus.length+" необязательных задач.")};
}
document.getElementById("databtn").onclick=dataModal;

/* ---------- nav ---------- */
document.getElementById("prev").onclick=()=>{sel=shift(sel,-1);render()};
document.getElementById("next").onclick=()=>{sel=shift(sel,1);render()};
document.getElementById("tobtn").onclick=()=>{sel=todayKey();render()};
document.addEventListener("keydown",e=>{
  if(document.getElementById("mask").classList.contains("on")){if(e.key==="Escape")closeModal();return}
  if(e.key==="ArrowLeft"){sel=shift(sel,-1);render()}
  if(e.key==="ArrowRight"){sel=shift(sel,1);render()}});

load();
</script>
